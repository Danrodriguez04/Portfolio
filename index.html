<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="assets/dist/index.css">
    <!--link rel="stylesheet" href="assets/dist/contact.css"-->
    <link rel="stylesheet" href="assets/dist/bar-nav.css">
    <!--link rel="stylesheet" href="assets/dist/project-section.css">
    <link rel="stylesheet" href="assets/fontawesome/css/all.css"-->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <title>Portfolio</title>
</head>
<body>
<header>
    <nav class="navbar">
        <div id="dropdown">
            <button id="open-navbar" class="navbar-toggler" type="button">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
        <div class="container">
            <div class="navbar-brand">
                <ul>
                    <li><a href="#home">Home</a></li>
                    <li><a href="#projects">Projectos</a></li>
                    <li><a href="#skils">Skills</a></li>
                    <li><a href="#reviews">Reseñas</a></li>
                    <li><a href="#contact">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<main>
    <section id="home"></section>
    <section id="projects"></section>
    <section id="skils"></section>
    <section id="reviews"></section>
    <section id="contact"></section>
</main>

<script>
    'use strict';

    (() => {
        addEvents();
    })();


    function addEvents(){
        const buttonsOpenNav = document.getElementById('open-navbar');

        buttonsOpenNav.addEventListener('click', () => {
           toggleNavbar();
        });
    }

    function toggleNavbar() {
        const navbar = document.getElementById('navbar');
        if (navbar) {
            navbar.classList.remove('is-active');
        } else {
            navbar.classList.add('is-active');
        }
    }

</script>

</body>
</html>
