<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="assets/dist/index.css">
    <link rel="stylesheet" href="assets/dist/bar-nav.css">
    <link rel="stylesheet" href="./assets/fontawesome/css/all.css">
    <title>Portfolio</title>
</head>
<body>
<header>
    <nav class="navbar">
        <div id="mobile-nav">
            <h1>Daniel Rodríguez</h1>
            <span id="open-navbar"><i class="fa-solid fa-bars"></i></span>
        </div>
        <div id="navbar-content">
            <div id="dropdown">
                <span id="title-nav">Navegación</span>
                <span id="close-nav"><i class="fa-solid fa-xmark"></i></span>
            </div>
            <div class="container-nav">
                <div class="navbar-brand">
                    <ul>
                        <li><a href="#home"><i class="fa-solid fa-house"></i> Inicio</a></li>
                        <li><a href="#about"><i class="fa-regular fa-user"></i> Sobre mí</a></li>
                        <li><a href="#projects"><i class="fa-solid fa-jet-fighter"></i> Projectos</a></li>
                        <li><a href="#skils"><i class="fa-regular fa-chart-bar"></i> Habilidades</a></li>
                        <li><a href="#contact"><i class="fa-regular fa-envelope"></i> Contacto</a></li>
                    </ul>
                </div>
            </div>
            <div id="follow">
                <span>Tambien me puedes encontrar en</span>
                <div class="social">
                    <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
                </div>
            </div>
        </div>
    </nav>
</header>

<main>
    <section id="home"></section>
    <section id="about"></section>
    <section id="projects"></section>
    <section id="skils"></section>
    <section id="contact"></section>
</main>

<script>
    'use strict';

    (() => {
        addEvents();
    })();


    function addEvents(){
        const buttonsOpenNav = document.getElementById('open-navbar');

        buttonsOpenNav.addEventListener('click', () => {
           toggleNavbar();
        });
    }

    function toggleNavbar() {
        const navbar = document.getElementById('navbar');
        if (navbar) {
            navbar.classList.remove('is-active');
        } else {
            navbar.classList.add('is-active');
        }
    }

</script>

</body>
</html>
