</main>

<script type="module">
    "use strict";

    (()=>{
        assignEvents();
    })();


    function assignEvents (){
        const dropdown = document.querySelector("#dropdown");
        const navBar = document.querySelector("#nav-name");
        const texts = document.querySelectorAll(".items")

        dropdown.addEventListener('click', () => {

            const isOpen = navBar.style.display !== 'none';

            if (isOpen){
                dropdown.classList.replace('fa-angle-left', 'fa-angle-right');
                document.body.style.gridTemplateColumns = '70px auto';
                document.querySelector('#bar-nav>nav').style.width = '50px';
                dropdown.style.left= '35px';
                navBar.style.display= 'none';

                for (let i = 0 ; i < texts.length; i++){
                    texts[i].style.display= 'none';
                }

            }else {
                dropdown.classList.replace('fa-angle-right', 'fa-angle-left');
                document.body.style.gridTemplateColumns = '18% auto';
                document.querySelector('#bar-nav>nav').style.width = '16%';
                dropdown.style.left= '12%';
                navBar.style.display= 'block';

                for (let i = 0 ; i < texts.length; i++){
                    texts[i].style.display= 'block';
                }
            }
        });

    }
</script>
